<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Yad2 Exporter Settings</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <h2>הגדרות סריקה</h2>
        <div class="form-group">
            <label for="maxPages">מקסימום עמודים לסריקה:</label>
            <input type="number" id="maxPages" min="1" placeholder="לדוגמה: 5 (ריק = ללא הגבלה)">
        </div>
        <div class="form-group">
            <label for="maxAds">מקסימום רכבים לסריקה:</label>
            <input type="number" id="maxAds" min="1" placeholder="לדוגמה: 100 (ריק = ללא הגבלה)">
        </div>
        <button id="saveBtn">שמור הגדרות</button>
        <div id="status"></div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
